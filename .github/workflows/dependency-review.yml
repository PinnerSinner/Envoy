name: Dependency review

# REQ-QSC-19 (SHOULD): fails a pull request that adds a dependency with a known high or critical vulnerability.
# The licence check stays off: NuGet packages often report only a licence URL, which shows up as unknown;
# THIRD-PARTY-NOTICES.md review covers licences instead.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
