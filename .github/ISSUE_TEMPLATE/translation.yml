name: Phrase / slang / translation fix
description: A wrong phrasebook translation, or slang Envoy should know
labels: [translations]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Korean
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text and what it really means
      placeholder: "ㄱㅅ — short for 감사 (thanks)"
    validations:
      required: true
