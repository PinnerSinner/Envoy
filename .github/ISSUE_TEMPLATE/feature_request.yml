name: Feature request
description: Suggest an idea for Envoy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation in game. What's missing or awkward?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
